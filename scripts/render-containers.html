<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const P = new URLSearchParams(location.search);
const i = Number(P.get('i') || 0);

/* Deterministic pseudo-random so a given index always renders the same frame. */
function rnd(seed){ let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

const BODY = ['#8C4A3A','#2F5D7C','#3C5A46','#6E7478','#8A7B63','#3A3E42','#C9C6BE','#A8552F','#4A5A63','#7A8A6F'];
const SKY  = [['#cfd6da','#8e9aa3'],['#dcd7cc','#a79c8c'],['#c6d2d8','#7f8f9a'],['#e0dbd2','#b3a999'],['#bfc9cf','#78848d']];

const W = 900, H = 675;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* Sky as a gradient backdrop */
const sky = SKY[i % SKY.length];
const sc = document.createElement('canvas'); sc.width = 4; sc.height = 256;
const sg = sc.getContext('2d');
const grad = sg.createLinearGradient(0,0,0,256);
grad.addColorStop(0, sky[0]); grad.addColorStop(1, sky[1]);
sg.fillStyle = grad; sg.fillRect(0,0,4,256);
scene.background = new THREE.CanvasTexture(sc);

/* Corrugated side texture */
/* One corrugation period, 64px wide. Shading runs dark-light-dark across the
   fold so the repeat count equals the number of corrugations on the panel. */
function corr(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 8;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,64,0);
  gr.addColorStop(0.00,'#4a4a4a');
  gr.addColorStop(0.16,'#6e6e6e');
  gr.addColorStop(0.34,'#d2d2d2');
  gr.addColorStop(0.50,'#f2f2f2');
  gr.addColorStop(0.66,'#cfcfcf');
  gr.addColorStop(0.84,'#6a6a6a');
  gr.addColorStop(1.00,'#4a4a4a');
  g.fillStyle = gr; g.fillRect(0,0,64,8);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const PITCH = 0.28;   /* metres between corrugations on a real container */
const TEX = corr();

function container(color, opts){
  const g = new THREE.Group();
  const L = opts.long ? 12.19 : 6.06, Hh = opts.hc ? 2.90 : 2.59, Wd = 2.44;
  const col = new THREE.Color(color);
  const mk = (span) => {
    const t = TEX.clone(); t.needsUpdate = true;
    t.repeat.set(Math.max(4, Math.round(span / PITCH)), 1);
    return new THREE.MeshStandardMaterial({ color: col.clone(), map:t, roughness:0.72, metalness:0.26 });
  };
  const plain = () => new THREE.MeshStandardMaterial({ color: col.clone(), roughness:0.76, metalness:0.24 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(L,Hh,Wd), [
    plain(), mk(Wd), mk(L), plain(), mk(L), mk(L)
  ]);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const trim = new THREE.MeshStandardMaterial({ color:new THREE.Color('#22262a'), roughness:0.5, metalness:0.55 });
  [[0,Hh/2,Wd/2],[0,Hh/2,-Wd/2],[0,-Hh/2,Wd/2],[0,-Hh/2,-Wd/2]].forEach(p=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(L,0.13,0.13), trim);
    m.position.set(...p); m.castShadow = true; g.add(m);
  });
  [-1,1].forEach(sx=>[-1,1].forEach(sy=>[-1,1].forEach(sz=>{
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.25,0.25), trim);
    c.position.set(sx*(L/2-0.11), sy*(Hh/2-0.07), sz*(Wd/2-0.1));
    c.castShadow = true; g.add(c);
  })));

  /* doors */
  const dm = plain();
  if(opts.rollup){
    for(let s=0;s<11;s++){
      const sl = new THREE.Mesh(new THREE.BoxGeometry(0.06,Hh/13,Wd*0.84), dm);
      sl.position.set(L/2+0.03, -Hh/2+0.25+s*(Hh/13+0.014), 0); sl.castShadow=true; g.add(sl);
    }
  } else {
    [-1,1].forEach(sz=>{
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.07,Hh*0.9,Wd*0.46), dm);
      d.position.set(L/2+0.03,0,sz*Wd*0.235); d.castShadow=true; g.add(d);
      [0.1,-0.1].forEach(o=>{
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,Hh*0.86,8), trim);
        rod.position.set(L/2+0.08,0,sz*Wd*0.235+o); g.add(rod);
      });
    });
  }

  if(opts.windows){
    const wf = new THREE.MeshStandardMaterial({ color:new THREE.Color('#1d2226'), roughness:0.4 });
    const gl = new THREE.MeshStandardMaterial({ color:new THREE.Color('#aad3e0'), roughness:0.08, metalness:0.2 });
    [-L*0.22, L*0.14].forEach(px=>{
      const f = new THREE.Mesh(new THREE.BoxGeometry(1.15,0.95,0.09), wf);
      f.position.set(px,0.34,Wd/2+0.01); g.add(f);
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.97,0.79,0.05), gl);
      p.position.set(px,0.34,Wd/2+0.06); g.add(p);
    });
  }
  if(opts.door){
    const pd = new THREE.Mesh(new THREE.BoxGeometry(0.95,2.05,0.1), new THREE.MeshStandardMaterial({color:new THREE.Color('#2a2f33'),roughness:0.55}));
    pd.position.set(L*0.3, -Hh/2+1.02, Wd/2+0.02); g.add(pd);
  }
  return g;
}

/* ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({ color:new THREE.Color(i%3===0?'#8d8778':'#7d8179'), roughness:1 })
);
ground.rotation.x = -Math.PI/2; ground.position.y = -1.45; ground.receiveShadow = true;
scene.add(ground);
scene.fog = new THREE.Fog(new THREE.Color(sky[1]), 34, 120);

const opts = {
  rollup: rnd(i+1) > 0.62,
  windows: rnd(i+2) > 0.5,
  door: rnd(i+3) > 0.55,
  long: rnd(i+4) > 0.55,
  hc: rnd(i+5) > 0.7,
};
const main = container(BODY[i % BODY.length], opts);
main.rotation.y = (rnd(i+6) - 0.5) * 0.25;
scene.add(main);

/* occasionally a second unit behind, for a yard feel */
if(rnd(i+7) > 0.55){
  const b = container(BODY[(i+4) % BODY.length], { rollup:false, windows:false, door:false, long:rnd(i+9)>0.5, hc:false });
  b.position.set(-3 - rnd(i+8)*5, 0, -7 - rnd(i+10)*4);
  b.rotation.y = (rnd(i+11) - 0.5) * 0.5;
  scene.add(b);
}

scene.add(new THREE.HemisphereLight(0xdfe8ef, 0x6b6656, 1.05));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.0);
sun.position.set(9, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xbcd4e0, 0.35).translateX(-8));

const cam = new THREE.PerspectiveCamera(38, W/H, 0.1, 400);
const L = opts.long ? 12.19 : 6.06;
const dist = L * 1.42 + 4.2;                    /* fills roughly 65% of frame */
const ang = 0.42 + rnd(i+13) * 0.5;             /* 24-53 deg: long side plus one end */
cam.position.set(Math.sin(ang)*dist, 1.9 + rnd(i+14)*2.0, Math.cos(ang)*dist);
cam.lookAt(0, -0.15, 0);

renderer.render(scene, cam);
window.__ready = true;
</script>
</body></html>
